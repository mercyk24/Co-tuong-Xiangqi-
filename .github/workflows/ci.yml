# Mỗi lần đẩy mã: kiểm tra lỗi mã, chạy kiểm tra luật cờ và kiểm tra giao diện.
# Nếu là nhánh main và mọi kiểm tra đều đạt thì tự triển khai lên GitHub Pages.
name: Kiểm tra và triển khai

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Kiểm tra
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Cài thư viện
        run: npm ci
      - name: Cài trình duyệt cho Playwright
        run: npx playwright install --with-deps chromium
      - name: Kiểm tra lỗi mã (ESLint)
        run: npm run lint
      - name: Kiểm tra luật cờ và dữ liệu
        run: npm run test:unit
      - name: Kiểm tra giao diện (Playwright)
        run: npm run test:e2e
      - name: Lưu báo cáo khi kiểm tra lỗi
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Đóng gói trang để triển khai
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # Kiểm tra lỗ hổng đã biết trong thư viện (chỉ báo, không chặn triển khai: lỗ hổng mới công bố trong công cụ
  # kiểm tra như ESLint không nên làm dừng việc sửa lỗi cho người dùng; Dependabot sẽ mở pull request để nâng cấp).
  audit:
    name: Kiểm tra lỗ hổng thư viện
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: npm audit (mức cao trở lên)
        run: npm audit --audit-level=high

  deploy:
    name: Triển khai GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
