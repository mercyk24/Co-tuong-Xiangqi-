# Mỗi lần đẩy mã: kiểm tra lỗi mã, chạy kiểm tra luật cờ và kiểm tra giao diện.
# Nếu là nhánh main và mọi kiểm tra đều đạt thì tự triển khai lên GitHub Pages.
name: Kiểm tra và triển khai

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Kiểm tra
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cài thư viện
        run: npm ci
      - name: Cài trình duyệt cho Playwright
        run: npx playwright install --with-deps chromium
      - name: Kiểm tra lỗi mã (ESLint)
        run: npm run lint
      - name: Kiểm tra luật cờ và dữ liệu
        run: npm run test:unit
      - name: Kiểm tra giao diện (Playwright)
        run: npm run test:e2e
      - name: Lưu báo cáo khi kiểm tra lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Đóng gói trang để triển khai
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Triển khai GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
